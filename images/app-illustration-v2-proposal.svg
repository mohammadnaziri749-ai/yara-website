<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 540" role="img" aria-label="تصویر اپلیکیشن یارا — نسخه پیشنهادی جدید">
  <defs>
    <!-- گرادیان قاب گوشی — تیل عمیق لوکس -->
    <linearGradient id="pFrame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11504a"/>
      <stop offset="0.55" stop-color="#0b403b"/>
      <stop offset="1" stop-color="#072f2c"/>
    </linearGradient>
    <!-- گرادیان صفحه — رابط تیره اپ -->
    <linearGradient id="pScreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f4a44"/>
      <stop offset="1" stop-color="#0a3833"/>
    </linearGradient>
    <!-- شیشه چیپ‌های شناور -->
    <linearGradient id="pGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14564f" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#0c423d" stop-opacity="0.92"/>
    </linearGradient>
    <!-- درخشش ملایم پشت گوشی -->
    <radialGradient id="pGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5faf8f" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#5faf8f" stop-opacity="0"/>
    </radialGradient>
    <!-- سایه لایه‌ای کم‌آلفا (توکن عمق از cal/DESIGN.md) -->
    <filter id="pShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#031a19" flood-opacity="0.30"/>
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#031a19" flood-opacity="0.26"/>
    </filter>
  </defs>

  <!-- هاله پشت گوشی -->
  <ellipse cx="230" cy="250" rx="200" ry="230" fill="url(#pGlow)"/>

  <!-- ===== قوس‌های تزیینی خیلی کم‌رنگ (به‌جای بلاب) ===== -->
  <circle cx="368" cy="108" r="86" fill="none" stroke="#7fd0af" stroke-opacity="0.10" stroke-width="1.5" stroke-dasharray="180 360"/>
  <circle cx="74" cy="420" r="64" fill="none" stroke="#7fd0af" stroke-opacity="0.08" stroke-width="1.5" stroke-dasharray="120 280"/>
  <circle cx="408" cy="330" r="4" fill="#7fd0af" opacity="0.28"/>
  <circle cx="52" cy="120" r="3.5" fill="#7fd0af" opacity="0.24"/>
  <path d="M 96 76 h 10 M 101 71 v 10" stroke="#7fd0af" stroke-opacity="0.30" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M 396 452 h 9 M 400.5 447.5 v 9" stroke="#7fd0af" stroke-opacity="0.24" stroke-width="1.5" stroke-linecap="round"/>

  <!-- ===== گوشی ===== -->
  <ellipse cx="230" cy="494" rx="128" ry="15" fill="#031a19" opacity="0.30"/>
  <g filter="url(#pShadow)">
    <rect x="130" y="70" width="200" height="404" rx="34" fill="url(#pFrame)"/>
    <rect x="133.5" y="73.5" width="193" height="397" rx="31" fill="none" stroke="#f6f5f0" stroke-opacity="0.12" stroke-width="1.5"/>
    <rect x="209" y="79" width="42" height="7" rx="3.5" fill="#062a27"/>
    <rect x="138" y="78" width="184" height="388" rx="27" fill="url(#pScreen)"/>
  </g>

  <!-- ===== محتوای صفحه — رابط تیره اپ یارا ===== -->
  <!-- نوار خوش‌آمد -->
  <circle cx="163" cy="122" r="12" fill="none" stroke="#7fd0af" stroke-width="2"/>
  <circle cx="163" cy="122" r="6" fill="#5faf8f"/>
  <rect x="184" y="112" width="72" height="6.5" rx="3.25" fill="#f6f5f0" opacity="0.88"/>
  <rect x="184" y="126" width="48" height="5" rx="2.5" fill="#f6f5f0" opacity="0.38"/>
  <circle cx="300" cy="121" r="6.5" fill="#5faf8f" opacity="0.9"/>
  <circle cx="300" cy="121" r="10.5" fill="none" stroke="#7fd0af" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- حلقه پایبندی به درمان -->
  <circle cx="230" cy="226" r="47" fill="none" stroke="#f6f5f0" stroke-opacity="0.10" stroke-width="11"/>
  <circle cx="230" cy="226" r="47" fill="none" stroke="#7fd0af" stroke-width="11" stroke-linecap="round"
          stroke-dasharray="213 295" transform="rotate(-90 230 226)"/>
  <circle cx="230" cy="226" r="30" fill="#0c423d"/>
  <circle cx="230" cy="226" r="30" fill="none" stroke="#7fd0af" stroke-opacity="0.30" stroke-width="1.2"/>
  <polyline points="217,226 226,235 244,215" stroke="#7fd0af" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- کارت داروی امروز -->
  <g filter="url(#pShadow)">
    <rect x="152" y="296" width="156" height="54" rx="14" fill="#f6f5f0" fill-opacity="0.06" stroke="#f6f5f0" stroke-opacity="0.12" stroke-width="1.2"/>
  </g>
  <g transform="rotate(-35 176 323)">
    <rect x="170" y="309" width="10" height="28" rx="5" fill="#7fd0af"/>
    <rect x="180" y="309" width="10" height="28" rx="5" fill="#0f4a44" stroke="#7fd0af" stroke-opacity="0.55" stroke-width="1"/>
  </g>
  <rect x="196" y="310" width="62" height="6" rx="3" fill="#f6f5f0" opacity="0.82"/>
  <rect x="196" y="323" width="42" height="5" rx="2.5" fill="#f6f5f0" opacity="0.38"/>
  <circle cx="290" cy="323" r="10" fill="#5faf8f"/>
  <polyline points="285.5,323 289,326.5 295,319.5" stroke="#062a27" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- کارت ثبت علائم + ECG -->
  <g filter="url(#pShadow)">
    <rect x="152" y="362" width="156" height="54" rx="14" fill="#f6f5f0" fill-opacity="0.06" stroke="#f6f5f0" stroke-opacity="0.12" stroke-width="1.2"/>
  </g>
  <circle cx="176" cy="389" r="10.5" fill="none" stroke="#7fd0af" stroke-width="2"/>
  <circle cx="176" cy="389" r="5" fill="#7fd0af"/>
  <rect x="196" y="376" width="52" height="6" rx="3" fill="#f6f5f0" opacity="0.82"/>
  <rect x="196" y="389" width="36" height="5" rx="2.5" fill="#f6f5f0" opacity="0.38"/>
  <polyline points="252,392 258,392 262,383 267,398 271,388 275,392 290,392" stroke="#7fd0af" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- نوار پایین -->
  <rect x="152" y="428" width="156" height="26" rx="13" fill="#f6f5f0" fill-opacity="0.05"/>
  <circle cx="176" cy="441" r="7" fill="#5faf8f"/>
  <rect x="204" y="437" width="9" height="9" rx="2" fill="none" stroke="#f6f5f0" stroke-opacity="0.45" stroke-width="1.6"/>
  <rect x="230" y="437" width="9" height="9" rx="2" fill="none" stroke="#f6f5f0" stroke-opacity="0.45" stroke-width="1.6"/>
  <circle cx="256" cy="441" r="5.5" fill="none" stroke="#f6f5f0" stroke-opacity="0.45" stroke-width="1.6"/>
  <circle cx="284" cy="441" r="4" fill="#f6f5f0" opacity="0.45"/>
  <rect x="208" y="460" width="44" height="4" rx="2" fill="#f6f5f0" opacity="0.22"/>

  <!-- ===== چیپ شناور: یادآوری دارو (بالا-راست) ===== -->
  <g filter="url(#pShadow)" transform="rotate(-3 372 130)">
    <rect x="326" y="108" width="96" height="46" rx="17" fill="url(#pGlass)" stroke="#7fd0af" stroke-opacity="0.38" stroke-width="1.2"/>
    <g transform="rotate(-35 350 124)">
      <rect x="345" y="112" width="8" height="24" rx="4" fill="#7fd0af"/>
      <rect x="353" y="112" width="8" height="24" rx="4" fill="#0a3833" stroke="#7fd0af" stroke-opacity="0.55" stroke-width="1"/>
    </g>
    <rect x="368" y="121" width="40" height="5.5" rx="2.75" fill="#f6f5f0" opacity="0.85"/>
    <rect x="368" y="133" width="26" height="4.5" rx="2.25" fill="#7fd0af" opacity="0.75"/>
    <circle cx="410" cy="116" r="4" fill="#7fd0af"/>
    <circle cx="410" cy="116" r="7.5" fill="none" stroke="#7fd0af" stroke-opacity="0.35" stroke-width="1.2"/>
  </g>

  <!-- ===== چیپ شناور: تقویم و تیک (چپ) ===== -->
  <g filter="url(#pShadow)" transform="rotate(3 78 232)">
    <rect x="46" y="198" width="64" height="66" rx="19" fill="url(#pGlass)" stroke="#7fd0af" stroke-opacity="0.38" stroke-width="1.2"/>
    <rect x="58" y="212" width="40" height="38" rx="9" fill="#0a3833" stroke="#f6f5f0" stroke-opacity="0.14" stroke-width="1.2"/>
    <rect x="58" y="212" width="40" height="12" rx="6" fill="#5faf8f"/>
    <circle cx="66" cy="218" r="1.8" fill="#f6f5f0"/>
    <circle cx="90" cy="218" r="1.8" fill="#f6f5f0"/>
    <rect x="66" y="232" width="10" height="9" rx="2" fill="#f6f5f0" opacity="0.30"/>
    <rect x="80" y="232" width="10" height="9" rx="2" fill="#f6f5f0" opacity="0.30"/>
    <circle cx="90" cy="243" r="8.5" fill="#7fd0af"/>
    <polyline points="86,243 89,246 94.5,240" stroke="#062a27" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ===== چیپ شناور: ساعت یادآور (پایین-راست) ===== -->
  <g filter="url(#pShadow)" transform="rotate(-3 356 408)">
    <circle cx="356" cy="408" r="26" fill="url(#pGlass)" stroke="#7fd0af" stroke-opacity="0.38" stroke-width="1.2"/>
    <circle cx="356" cy="408" r="16" fill="none" stroke="#7fd0af" stroke-width="2.2"/>
    <path d="M 356 399 v 9 l 6.5 4.5" stroke="#f6f5f0" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="356" cy="381" r="2.6" fill="#7fd0af"/>
  </g>

  <!-- ===== چیپ شناور: قلب و ECG (پایین-چپ) ===== -->
  <g filter="url(#pShadow)" transform="rotate(3 84 396)">
    <rect x="50" y="368" width="68" height="56" rx="18" fill="url(#pGlass)" stroke="#7fd0af" stroke-opacity="0.38" stroke-width="1.2"/>
    <path d="M 68 384 c -3 -4.5 -9 -3.5 -9 1.5 c 0 4.5 5.5 8 9 11 c 3.5 -3 9 -6.5 9 -11 c 0 -5 -6 -6 -9 -1.5 Z" fill="#7fd0af"/>
    <polyline points="80,392 85,392 88,386 92,398 95,390 98,392 108,392" stroke="#f6f5f0" stroke-opacity="0.9" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="62" y="406" width="34" height="4.5" rx="2.25" fill="#f6f5f0" opacity="0.35"/>
  </g>
</svg>
